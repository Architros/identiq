<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Identiq verification code</title>
</head>
<body style="margin:0;padding:0;background-color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f7f7f8;padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:480px;background-color:#ffffff;border-radius:16px;border:1px solid #e5e7eb;overflow:hidden;">
          <tr>
            <td style="padding:32px 32px 24px;text-align:center;background:linear-gradient(180deg,#fff7f2 0%,#ffffff 100%);">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center">
                <tr>
                  <td style="vertical-align:middle;padding-right:10px;line-height:0;">
                    <svg width="36" height="26" viewBox="0 0 49 36" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Identiq" style="display:block;">
                      <path d="M0 20.1249L20.1249 0L40.1585 20.0336L20.0777 10.5887L0 20.1249Z" fill="#F86E29"/>
                      <path d="M48.5163 36H20.0554V7.66823L27.5761 28.5461L48.5163 36Z" fill="#F86E29"/>
                    </svg>
                  </td>
                  <td style="vertical-align:middle;font-size:22px;font-weight:600;letter-spacing:-0.02em;color:#111827;">
                    identiq
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 32px 32px;">
              <h1 style="margin:0 0 12px;font-size:22px;font-weight:600;line-height:1.3;color:#111827;text-align:center;">
                Your verification code
              </h1>
              <p style="margin:0 0 28px;font-size:15px;line-height:1.6;color:#6b7280;text-align:center;">
                Enter this 6-digit code in Identiq to continue. It expires in a few minutes.
              </p>
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td align="center" style="padding:20px 16px;background-color:#f7f7f8;border-radius:12px;border:1px dashed #e5e7eb;">
                    <span style="display:inline-block;font-size:36px;font-weight:700;letter-spacing:0.35em;color:#111827;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;padding-left:0.35em;">
                      {{ .Token }}
                    </span>
                  </td>
                </tr>
              </table>
              <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#6b7280;text-align:center;">
                Sent to <strong style="color:#111827;">{{ .Email }}</strong>
              </p>
              <p style="margin:20px 0 0;font-size:12px;line-height:1.5;color:#9ca3af;text-align:center;">
                If you didn&apos;t request this code, you can ignore this email. Someone may have entered your address by mistake.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px;background-color:#fafafa;border-top:1px solid #e5e7eb;text-align:center;">
              <p style="margin:0;font-size:12px;line-height:1.5;color:#9ca3af;">
                © Identiq · AI brand system
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
